services:
  bot:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ${MEDIA_RELAY_CONTAINER_NAME:-mpro-media-relay-bot}
    restart: unless-stopped
    env_file:
      - ${MEDIA_RELAY_ENV_FILE:-./config/.env}
    environment:
      HOME: /tmp
      TMPDIR: /data/tmp
      TEMP: /data/tmp
      TMP: /data/tmp
    init: true
    read_only: true
    ports:
      - "127.0.0.1:${MEDIA_RELAY_HTTP_PORT:-8080}:8080"
    volumes:
      - ${MEDIA_RELAY_DATA_ROOT:-./runtime}/downloads:/data/downloads
      - ${MEDIA_RELAY_DATA_ROOT:-./runtime}/tmp:/data/tmp
      - ${MEDIA_RELAY_DATA_ROOT:-./runtime}/data:/data/data
      - ${MEDIA_RELAY_DATA_ROOT:-./runtime}/cookies:/data/cookies:ro
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEDIA_RELAY_MEM_LIMIT:-700m}
    memswap_limit: ${MEDIA_RELAY_MEMSWAP_LIMIT:-2g}
    cpus: ${MEDIA_RELAY_CPUS:-1.80}
    pids_limit: ${MEDIA_RELAY_PIDS_LIMIT:-256}
