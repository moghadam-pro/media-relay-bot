services:
  bot:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: media-relay-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      HOME: /tmp
      TMPDIR: /data/tmp
      TEMP: /data/tmp
      TMP: /data/tmp
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime/downloads:/data/downloads
      - ./runtime/tmp:/data/tmp
      - ./runtime/data:/data/data
      - ./runtime/cookies:/data/cookies:ro
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 700m
    memswap_limit: 2g
    cpus: 1.80
    pids_limit: 256
